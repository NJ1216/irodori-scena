name: Windows installer release

# Builds the unsigned Windows x64 NSIS installer for a pushed v* tag and attaches it
# to a draft GitHub Release. Publishing the draft is a manual, reviewed step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - name: Check that the tag matches the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node tools/release/version.mjs --expect $env:RELEASE_TAG.Substring(1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the Windows build contract
        run: |
          pnpm check:windows-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the NSIS installer
        run: |
          pnpm tauri:build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show Tauri resource staging after a failure
        if: failure()
        run: |
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          Get-ChildItem -LiteralPath $release -Force | Format-Table Mode, Length, Name -AutoSize | Out-String -Width 200
          Get-ChildItem -LiteralPath "src-tauri/binaries" -Force -ErrorAction SilentlyContinue | Format-Table Mode, Name -AutoSize | Out-String -Width 200
          Get-ChildItem -LiteralPath "src-tauri/target" -Recurse -Filter "scena-api.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-ChildItem Env: | Where-Object { $_.Name -match "^(CARGO|RUST)" } | ForEach-Object { "$($_.Name)=$($_.Value)" }
          rustc -vV
          cargo -vV
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          foreach ($config in @((Join-Path $cargoHome "config.toml"), (Join-Path $cargoHome "config"), "D:/a/.cargo/config.toml", "D:/.cargo/config.toml", "src-tauri/.cargo/config.toml", ".cargo/config.toml")) {
            if (Test-Path -LiteralPath $config) { Write-Output "== $config"; Get-Content -LiteralPath $config }
          }
          Get-ChildItem -Path "$release/build/irodori-scena-*" -Directory | ForEach-Object {
            Write-Output "== $($_.Name)"
            foreach ($name in @("output", "stderr")) {
              $file = Join-Path $_.FullName $name
              if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file | Where-Object { $_ -notmatch "rustc-env|rustc-cfg|check-cfg" } | Select-Object -First 80 }
            }
          }
      - name: Create a draft release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/irodori SCENA_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$installer.sha256"
          [IO.File]::WriteAllText($checksum, "$hash  $(Split-Path -Leaf $installer)`n")
          gh release create "$env:RELEASE_TAG" $installer $checksum --title "irodori SCENA $env:RELEASE_TAG" --notes "下書きです。公開前にリリースノートを記入します。" --draft --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
