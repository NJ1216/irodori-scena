[package]
name = "irodori-scena"
version = "26.11.28"
description = "irodori SCENA development shell"
authors = ["irodori SCENA"]
edition = "2021"
default-run = "irodori-scena"

[lib]
name = "irodori_scena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Streams only loopback http:// responses from the local API, so no TLS backend.
reqwest = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["libc", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }
